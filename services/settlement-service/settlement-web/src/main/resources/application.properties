spring.application.name=settlement
server.port=${PORT:8084}
server.forward-headers-strategy=framework

### settlement
settlement.event-bus=${SETTLEMENT_EVENT_BUS:kafka}
# A record that still fails after the retries goes here (headers kafka_dlt-*), and consumption goes on.
settlement.kafka.dead-letter-topic=${SETTLEMENT_DLQ_TOPIC:settlement-service.dlq}
settlement.kafka.retries=${SETTLEMENT_KAFKA_RETRIES:3}
settlement.kafka.retry-backoff=${SETTLEMENT_KAFKA_RETRY_BACKOFF:1s}

### kafka
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}
spring.kafka.admin.auto-create=false
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

logging.level.org.apache.kafka=ERROR
logging.level.org.springframework.kafka=ERROR

### db

spring.datasource.url=jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/settlementdb
spring.datasource.username=${PG_USER:platform}
spring.datasource.password=${PG_PASSWORD:platform}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================
# JPA
# ===================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# ===================
# Flyway
# ===================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===================
# Database Pool
# ===================

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:32}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:8}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}

# ===================
# Logging
# ===================

logging.level.root=INFO
logging.level.com.pl.hragency=INFO

## actuator
management.endpoints.web.exposure.include=health,info

management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

###
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

### SWAGGER
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/api-spec